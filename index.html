<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Qaza Time</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    .header {
      background: #0f5132;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .location-input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ccd1d1;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .search-button {
      background: #0f5132;
      color: white;
    }

    .current-button {
      background: #e8f5e9;
      color: #0f5132;
    }

    #result {
      margin-top: 20px;
      font-size: 16px;
    }

    .prayer {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .prayer:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Qaza Time</h1>
    <p>Prayer Time & Qaza Checker</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>📍 Choose Your Location</h2>

      <input
        class="location-input"
        id="location"
        type="text"
        placeholder="Enter a place, e.g. Mankave"
      >

      <button
        class="search-button"
        onclick="searchLocation()"
      >
        🔍 Search Location
      </button>

      <button
        class="current-button"
        onclick="useCurrentLocation()"
      >
        📍 Use Current Location
      </button>

      <div id="result"></div>
    </div>

    <div class="card">
      <h2>🕌 Prayer Times</h2>

      <div class="prayer">
        <span>Fajr</span>
        <strong>--:--</strong>
      </div>

      <div class="prayer">
        <span>Sunrise</span>
        <strong>--:--</strong>
      </div>

      <div class="prayer">
        <span>Zuhr</span>
        <strong>--:--</strong>
      </div>

      <div class="prayer">
        <span>Asr</span>
        <strong>--:--</strong>
      </div>

      <div class="prayer">
        <span>Maghrib</span>
        <strong>--:--</strong>
      </div>

      <div class="prayer">
        <span>Isha</span>
        <strong>--:--</strong>
      </div>
    </div>

  </div>

  <script>
    <script>
  async function searchLocation() {
    const input = document.getElementById("location").value.trim();
    const result = document.getElementById("result");

    if (input === "") {
      result.textContent = "Please enter a place.";
      return;
    }

    result.textContent = "🔎 Searching...";

    try {
      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?q=" + encodeURIComponent(input) +
        "&format=jsonv2" +
        "&addressdetails=1" +
        "&limit=5";

      const response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Search failed");
      }

      const places = await response.json();

      if (places.length === 0) {
        result.innerHTML =
          "❌ No place found.<br><br>" +
          "Try typing a nearby town, city, or district.";
        return;
      }

      result.innerHTML = "<h3>📍 Choose a location:</h3>";

      places.forEach((place, index) => {
        const button = document.createElement("button");

        button.textContent = place.display_name;
        button.style.background = "#ffffff";
        button.style.color = "#17202a";
        button.style.border = "1px solid #ccd1d1";
        button.style.textAlign = "left";
        button.style.marginTop = "10px";

        button.onclick = function () {
          selectLocation(place);
        };

        result.appendChild(button);
      });

    } catch (error) {
      console.error(error);

      result.innerHTML =
        "❌ Something went wrong while searching.<br>" +
        "Please try again.";
    }
  }


  function selectLocation(place) {
    const result = document.getElementById("result");

    result.innerHTML =
      "<h3>✅ Location Selected</h3>" +
      "<p><strong>" +
      place.display_name +
      "</strong></p>" +
      "<p>Latitude: " + place.lat + "</p>" +
      "<p>Longitude: " + place.lon + "</p>";

    console.log("Selected place:", place);
  }


  function useCurrentLocation() {
    const result = document.getElementById("result");

    if (!navigator.geolocation) {
      result.textContent =
        "❌ Your browser does not support location.";
      return;
    }

    result.textContent =
      "📍 Asking for your current location...";

    navigator.geolocation.getCurrentPosition(
      function (position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        result.innerHTML =
          "<h3>✅ Current Location Found</h3>" +
          "<p>Latitude: " + latitude + "</p>" +
          "<p>Longitude: " + longitude + "</p>";
      },

      function () {
        result.innerHTML =
          "❌ Location permission was not allowed.<br><br>" +
          "You can search for your place manually.";
      }
    );
  }
</script>
  </script>

</body>
</html>
